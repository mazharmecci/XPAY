<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XPAY</title>
  
  <!-- android App Settings -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="XPAY">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fdf6f0, #f7e9dc);
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      animation: fadeInBody 1.2s ease-in;
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .landing-wrapper {
      background: #fff8f2;
      padding: 2rem 3rem;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 420px;
      width: 100%;
      margin-bottom: 20px;
      animation: fadeInUp 1.2s ease-out;
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .landing-logo {
      width: 90px;
      margin-bottom: 1rem;
      animation: fadeIn 1.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .landing-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: #5a4632;
      margin-bottom: 1.5rem;
    }

    .role-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      color: #fff;
      animation: fadeInUp 1.4s ease-out;
    }

    .role-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    /* Biscuit‑flavored role colors */
    .employee-btn { background: #d9a066; }
    .accountant-btn { background: #c97c5d; }
    .manager-btn { background: #a97142; }

    /* Footer always sticks to bottom */
    .site-footer {
      background-color: #fff;
      color: #f5c995;
      border-top: 1px solid #ddd;
      padding: 1.6rem 1rem 1.45rem 1rem;
      width: 100%;
      box-sizing: border-box;
      font-size: 0.98rem;
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 10;
    }
    .footer-content {
      display: flex;
      position: fixed;
      justify-content: left;
      align-items: left;
      gap: 2rem;
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 1.3rem;
    }
    .footer-logo {
      width: 48px;
      height: 48px;
      margin-bottom: 0.5rem;
    }
    .footer-text p {
      margin: 0.2rem 0;
      color: #a67845;
    }

    @media (max-width: 600px) {
      .landing-wrapper { padding: 1rem; }
      .site-footer { font-size: 0.85rem; padding: 1rem 0.5rem; }
      .footer-logo { width: 36px; height: 36px; }
      .footer-content, .footer-brand { flex-direction: column; gap: 0.7rem; }
    }
  </style>
</head>
<body>
  <div class="landing-wrapper">
    <img src="images/xpay.png" alt="XPAY Logo" class="landing-logo" />
    <a href="https://mazharmecci.github.io/XPAY/login.html" target="_blank" class="role-btn employee-btn">🧑‍💼 Sales/Service person</a>
    <a href="https://mazharmecci.github.io/XPAY/login.html" target="_blank" class="role-btn accountant-btn">🧾 Accountant</a>
    <a href="https://mazharmecci.github.io/XPAY/login.html" target="_blank" class="role-btn manager-btn">👔 Manager</a>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-brand">
        <img src="images/favicon-96x96.png" alt="ISTOS Logo" class="footer-logo" />
        <div class="footer-text">
          <p><strong>XPAY by ISTOS Medical Private Limited</strong></p>
          <p>51/5, Ground Floor, BSTN Heights,<br>
          2nd Cr J.C Industrial Area, Bakasipura Mn Rd,<br>
          Yelachenhalli, Bangalore - 560062</p>
          <p>© 2015–2025 ISTOS Medical Private Limited.</p>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
